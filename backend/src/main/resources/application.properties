spring.application.name=tech-store-backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/techstore_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a6730646cb71110318c4f9f6e91498f454628d23c2dd71c15dd7108479f1113
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.techstore=INFO
